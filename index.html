<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibonarium Heatmap – Trend & Memory (60+ API)</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
body { background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px 0; }
h1 { margin-bottom:20px; font-size:2rem; color:#cfefff; text-align:center; }
.heatmap { 
  display:grid; 
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); 
  gap:10px; 
  width:95%; 
  max-width:1400px; 
}
.cell { 
  display:flex; 
  flex-direction:column; 
  justify-content:center; 
  align-items:center; 
  border-radius:14px; 
  background:#111; 
  font-weight:bold; 
  font-size:0.95rem; 
  padding:10px 6px; 
  transition:all 0.4s ease; 
  position:relative; 
  cursor:pointer; 
  box-shadow:0 4px 15px rgba(0,0,0,0.3);
  border:1px solid #222;
}
.cell:hover { 
  transform:translateY(-4px); 
  box-shadow:0 8px 25px rgba(0,255,221,0.15); 
}
.cell.alert { 
  animation:pulseRed 1.2s infinite; 
  border-color:#ff0000; 
}
.cell:hover .tooltip { opacity:1; }
.tooltip { 
  position:absolute; 
  bottom:100%; 
  left:50%; 
  transform:translateX(-50%); 
  background:#222; 
  padding:6px 12px; 
  border-radius:8px; 
  font-size:0.8rem; 
  opacity:0; 
  transition:opacity 0.3s; 
  white-space:nowrap; 
  z-index:10; 
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  pointer-events:none;
}
@keyframes pulseRed {
  0%{box-shadow:0 0 8px #ff0000;}
  50%{box-shadow:0 0 25px #ff0000;}
  100%{box-shadow:0 0 8px #ff0000;}
}
.center-index { 
  grid-column:1/-1; 
  font-size:1.6rem; 
  border:3px solid #00ffdd; 
  border-radius:18px; 
  padding:16px; 
  text-align:center; 
  margin-top:14px; 
  animation:glow 2.5s infinite alternate;
  background:#111;
  box-shadow:0 6px 20px rgba(0,255,221,0.2);
}
@keyframes glow { 
  from{box-shadow:0 0 10px #00ffdd;} 
  to{box-shadow:0 0 30px #00ffdd;} 
}
#pulseCanvas { 
  margin-top:24px; 
  background:linear-gradient(#111,#0a0a0a); 
  border-radius:14px; 
  width:90%; 
  max-width:1400px; 
  height:200px; 
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
}
.trendCanvas { 
  width:100%; 
  height:80px; 
  margin-top:8px; 
  background:#0f0f0f; 
  border-radius:6px; 
}
@media (max-width:600px) { 
  .cell { font-size:0.85rem; padding:8px 4px; } 
  .trendCanvas { height:65px; } 
  .center-index { font-size:1.4rem; }
}
</style>
</head>
<body>
<h1>Ibonarium Heatmap – Trend & Memory (60+ Free APIs)</h1>
<div class="heatmap" id="heatmap"></div>
<canvas id="pulseCanvas"></canvas>

<script>
// ===== Індикатори: 60+ вільних API (додано ~20 нових) =====
const indicators = [
  {name:"BTC/USD", type:"realtime", api:"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd", extract: d => d.bitcoin.usd, min:0, max:100000, unit:'$'},
  {name:"ETH/USD", type:"realtime", api:"https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd", extract: d => d.ethereum.usd, min:0, max:10000, unit:'$'},
  {name:"DOGE/USD", type:"realtime", api:"https://api.coingecko.com/api/v3/simple/price?ids=dogecoin&vs_currencies=usd", extract: d => d.dogecoin.usd, min:0, max:1, unit:'$'},
  {name:"GitHub React", type:"realtime", api:"https://api.github.com/repos/facebook/react/commits?per_page=5", extract: d => d.length, min:0, max:10, unit:' commits'},
  {name:"GitHub Python", type:"realtime", api:"https://api.github.com/repos/python/cpython/commits?per_page=5", extract: d => d.length, min:0, max:10, unit:' commits'},
  {name:"Kyiv Temp", type:"realtime", api:"https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.523&current_weather=true", extract: d => d.current_weather.temperature, min:-20, max:40, unit:'°C'},
  {name:"Kyiv Wind", type:"realtime", api:"https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.523&current_weather=true", extract: d => d.current_weather.windspeed, min:0, max:50, unit:' km/h'},
  {name:"Reddit r/ukraine", type:"hourly", api:"https://www.reddit.com/r/ukraine/top.json?limit=5&t=day", extract: d => d.data.children.length, min:0, max:5, unit:' posts'},
  {name:"CVE Latest", type:"hourly", api:"https://cve.circl.lu/api/last/30", extract: d => d.length, min:0, max:30, unit:' CVEs'},
  {name:"Solar Density", type:"hourly", api:"https://services.swpc.noaa.gov/products/solar-wind/plasma-6-hour.json", extract: d => parseFloat(d[d.length-1][1]) || 0, min:0, max:50, unit:' p/cm³'},
  {name:"Binance BTC 24hr", type:"realtime", api:"https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT", extract: d => parseFloat(d.lastPrice), min:0, max:100000, unit:'$'},
  {name:"CoinDesk BTC", type:"realtime", api:"https://api.coindesk.com/v1/bpi/currentprice.json", extract: d => d.bpi.USD.rate_float, min:0, max:100000, unit:'$'},
  {name:"CoinCap Assets", type:"realtime", api:"https://api.coincap.io/v2/assets", extract: d => d.data.length, min:0, max:100, unit:' assets'},
  {name:"CoinLore Tickers", type:"realtime", api:"https://api.coinlore.net/api/tickers/", extract: d => d.data.length, min:0, max:100, unit:' tickers'},
  {name:"Coinpaprika BTC", type:"realtime", api:"https://api.coinpaprika.com/v1/tickers/btc-bitcoin", extract: d => d.quotes.USD.price, min:0, max:100000, unit:'$'},
  {name:"ExchangeRate USD", type:"realtime", api:"https://open.er-api.com/v6/latest/USD", extract: d => Object.keys(d.rates).length, min:0, max:200, unit:' rates'},
  {name:"Gemini BTCUSD", type:"realtime", api:"https://api.gemini.com/v2/ticker/btcusd", extract: d => parseFloat(d.last), min:0, max:100000, unit:'$'},
  {name:"Kraken LTCUSD", type:"realtime", api:"https://api.kraken.com/0/public/Trades?pair=ltcusd", extract: d => d.result.LTCUSD.length, min:0, max:1000, unit:' trades'},
  {name:"KuCoin BTC-USDT", type:"realtime", api:"https://api.kucoin.com/api/v1/market/stats?symbol=BTC-USDT", extract: d => parseFloat(d.data.lastTradedPrice), min:0, max:100000, unit:'$'},
  {name:"NBP Gold", type:"hourly", api:"http://api.nbp.pl/api/cenyzlota/last/30/?format=json", extract: d => d[d.length-1].cena, min:0, max:300, unit:' PLN/g'},
  {name:"Reddit Stocks", type:"hourly", api:"https://tradestie.com/api/v1/apps/reddit", extract: d => d.length, min:0, max:50, unit:' stocks'},
  {name:"7Timer Astro", type:"realtime", api:"http://www.7timer.info/bin/api.pl?lon=113.17&lat=23.09&product=astro&output=json", extract: d => d.dataseries[0].temp2m, min:-10, max:40, unit:'°C'},
  {name:"Open-Meteo Berlin", type:"realtime", api:"https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current_weather=true", extract: d => d.current_weather.temperature, min:-20, max:40, unit:'°C'},
  {name:"SG Air Temp", type:"realtime", api:"https://api.data.gov.sg/v1/environment/air-temperature", extract: d => d.items[0].readings.length, min:0, max:50, unit:' readings'},
  {name:"wttr London", type:"realtime", api:"https://wttr.in/London?format=j1", extract: d => parseInt(d.current_condition[0].temp_C), min:-10, max:40, unit:'°C'},
  {name:"Brasil Feriados", type:"hourly", api:"https://brasilapi.com.br/api/feriados/v1/2026", extract: d => d.length, min:0, max:20, unit:' holidays'},
  {name:"Data USA Pop", type:"hourly", api:"https://datausa.io/api/data?drilldowns=Nation&measures=Population", extract: d => d.data[0].Population, min:0, max:400000000, unit:' people'},
  {name:"FBI Wanted", type:"hourly", api:"https://api.fbi.gov/wanted/v1/list", extract: d => d.total, min:0, max:1000, unit:' wanted'},
  {name:"USGS Quakes", type:"hourly", api:"https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=2026-01-01&endtime=2026-01-06&minmagnitude=2", extract: d => d.features.length, min:0, max:100, unit:' quakes'},
  {name:"Carbon Intensity", type:"hourly", api:"https://api.carbonintensity.org.uk/intensity", extract: d => d.data[0].intensity.forecast, min:0, max:500, unit:' gCO2/kWh'},
  {name:"UK Police Crimes", type:"hourly", api:"https://data.police.uk/api/crimes-street/all-crime?lat=52.629729&lng=-1.131592&date=2025-12", extract: d => d.length, min:0, max:1000, unit:' crimes'},
  {name:"PM2.5 Taiwan", type:"realtime", api:"https://pm25.lass-net.org/API-1.0.0/project/airbox/latest/", extract: d => d.feeds.length, min:0, max:1000, unit:' sensors'},
  {name:"Wiki Pageviews", type:"hourly", api:"https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/all-agents/Ukraine/daily/20260101/20260105", extract: d => d.items.reduce((sum, i) => sum + i.views, 0), min:0, max:1000000, unit:' views'},
  {name:"NASA Asteroids", type:"hourly", api:"https://api.nasa.gov/neo/rest/v1/feed/today?detailed=false&api_key=DEMO_KEY", extract: d => d.element_count, min:0, max:50, unit:' asteroids'},
  {name:"SpaceX Capsules", type:"hourly", api:"https://api.spacexdata.com/v5/capsules", extract: d => d.length, min:0, max:20, unit:' capsules'},
  {name:"HackerNews Top", type:"hourly", api:"https://hacker-news.firebaseio.com/v0/topstories.json", extract: d => d.length, min:0, max:500, unit:' stories'},
  {name:"REST Countries", type:"hourly", api:"https://restcountries.com/v3.1/all", extract: d => d.length, min:0, max:300, unit:' countries'},
  {name:"IPify IP", type:"realtime", api:"https://api.ipify.org?format=json", extract: d => 1, min:0, max:1, unit:' IP'},
  {name:"IPinfo Geo", type:"realtime", api:"https://ipinfo.io/json", extract: d => d.loc ? 100 : 0, min:0, max:100, unit:'% geo'},
  {name:"OpenUV Global", type:"realtime", api:"https://api.openuv.io/api/v1/uv?lat=0&lng=0", extract: d => d.result?.uv || 0, min:0, max:12, unit:' UV'},
  // ===== Нові індикатори (додано 20+) =====
  {name:"ISS People", type:"hourly", api:"http://api.open-notify.org/astros.json", extract: d => d.number, min:0, max:20, unit:' people in space'},
  {name:"ISS Location", type:"realtime", api:"http://api.open-notify.org/iss-now.json", extract: d => d.iss_position.latitude, min:-90, max:90, unit:' lat'},
  {name:"Bored Suggestion", type:"hourly", api:"https://www.boredapi.com/api/activity", extract: d => d.price * 100, min:0, max:100, unit:'% cost'},
  {name:"Cat Fact Length", type:"hourly", api:"https://catfact.ninja/fact", extract: d => d.length, min:0, max:300, unit:' chars'},
  {name:"Dog Image Count", type:"realtime", api:"https://dog.ceo/api/breeds/image/random/10", extract: d => d.message.length, min:0, max:10, unit:' images'},
  {name:"Joke Length", type:"hourly", api:"https://v2.jokeapi.dev/joke/Any?safe-mode", extract: d => d.setup ? d.setup.length + d.delivery.length : d.joke.length, min:0, max:500, unit:' chars'},
  {name:"Random User Count", type:"realtime", api:"https://randomuser.me/api/?results=10", extract: d => d.results.length, min:0, max:10, unit:' users'},
  {name:"Pokemon Count", type:"hourly", api:"https://pokeapi.co/api/v2/pokemon?limit=100", extract: d => d.results.length, min:0, max:100, unit:' pokemon'},
  {name:"Quote Length", type:"hourly", api:"https://api.quotable.io/random", extract: d => d.length, min:0, max:300, unit:' chars'},
  {name:"Chuck Norris Joke", type:"hourly", api:"https://api.chucknorris.io/jokes/random", extract: d => d.value.length, min:0, max:300, unit:' chars'},
  {name:"Yes/No Answer", type:"realtime", api:"https://yesno.wtf/api", extract: d => d.answer === 'yes' ? 100 : 0, min:0, max:100, unit:'% yes'},
  {name:"Advice Length", type:"hourly", api:"https://api.adviceslip.com/advice", extract: d => JSON.parse(d).slip.advice.length, min:0, max:200, unit:' chars'},
  {name:"Fox Image", type:"realtime", api:"https://randomfox.ca/floof/", extract: d => 1, min:0, max:1, unit:' fox'},
  {name:"Ron Swagger Quote", type:"hourly", api:"https://ron-swanson-quotes.herokuapp.com/v2/quotes", extract: d => d[0].length, min:0, max:200, unit:' chars'},
  {name:"Kanye Quote", type:"hourly", api:"https://api.kanye.rest/", extract: d => d.quote.length, min:0, max:300, unit:' chars'},
  {name:"Trump Quote", type:"hourly", api:"https://api.tronalddump.io/random/quote", extract: d => d.value.length, min:0, max:500, unit:' chars'},
  {name:"Affirmation", type:"hourly", api:"https://www.affirmations.dev/", extract: d => d.affirmation.length, min:0, max:200, unit:' chars'},
  {name:"Activity Price", type:"hourly", api:"https://www.boredapi.com/api/activity", extract: d => d.participants, min:1, max:10, unit:' people'},
  {name:"Sunrise Kyiv", type:"hourly", api:"https://api.sunrise-sunset.org/json?lat=50.45&lng=30.523&formatted=0", extract: d => new Date(d.results.sunrise).getHours(), min:0, max:24, unit:' hour'},
  {name:"Number Fact", type:"hourly", api:"http://numbersapi.com/random/trivia", extract: d => d.length, min:0, max:100, unit:' chars'},
  {name:"Excuse", type:"hourly", api:"https://excuser-three.vercel.app/v1/excuse", extract: d => d[0].id, min:0, max:100, unit:' id'}
];

// ===== Решта коду без змін =====
const heatmap = document.getElementById("heatmap");
const pulseCanvas = document.getElementById("pulseCanvas");
let pulseCtx = pulseCanvas.getContext("2d");
let prevNorm = Array(indicators.length).fill(50);
let prevDelta = Array(indicators.length).fill(0);
let pulseHistory = [];
let trendHistory = indicators.map(()=>[]);

indicators.forEach((ind,i)=>{
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.id = "cell" + i;
  cell.innerHTML = `${ind.name}<div class="value">— ${ind.unit||''}</div><div class="tooltip"></div><canvas class="trendCanvas" id="trend${i}"></canvas>`;
  heatmap.appendChild(cell);
});

const center = document.createElement("div");
center.className = "center-index";
center.id = "center";
center.textContent = "Стан системи: —";
heatmap.appendChild(center);

function resizeCanvases() {
  const trendCanvases = document.querySelectorAll('.trendCanvas');
  trendCanvases.forEach(c => { 
    c.width = c.parentElement.clientWidth - 12; 
    c.height = 80; 
  });
  pulseCanvas.width = pulseCanvas.parentElement.clientWidth - 40;
  pulseCanvas.height = 200;
  drawPulse();
  trendHistory.forEach((_,i) => drawTrend(i));
}
window.addEventListener('resize', resizeCanvases);
setTimeout(resizeCanvases, 100);

async function fetchVal(ind) {
  try {
    const resp = await fetch(ind.api);
    if (!resp.ok) throw new Error(resp.status);
    const d = await resp.json();
    return ind.extract(d);
  } catch (e) {
    console.error(`Error fetching ${ind.name}:`, e);
    return null;
  }
}

function normalize(val, min, max) {
  if (val === null) return null;
  return Math.max(0, Math.min(100, ((val - min) / (max - min)) * 100));
}

function getColor(norm) {
  if (norm < 30) return {bg:"#ff0000", alert:true};
  if (norm < 70) return {bg:"#ffaa00", alert:false};
  return {bg:"#00ff00", alert:false};
}

async function update(type) {
  const promises = indicators.filter(ind => ind.type === type).map(fetchVal);
  const rawValues = await Promise.all(promises);
  let totalNorm = 0;
  let validCount = 0;
  let idx = 0;

  indicators.forEach((ind, i) => {
    if (ind.type === type) {
      const raw = rawValues[idx++];
      const norm = raw !== null ? normalize(raw, ind.min, ind.max) : prevNorm[i];
      if (norm !== null) {
        prevNorm[i] = norm;
        prevDelta[i] = trendHistory[i].length > 0 ? norm - trendHistory[i][trendHistory[i].length-1] : 0;
        totalNorm += norm;
        validCount++;
      }
      const cell = document.getElementById("cell" + i);
      const valueEl = cell.querySelector(".value");
      const tooltip = cell.querySelector(".tooltip");
      if (raw !== null) valueEl.textContent = `${raw.toFixed ? raw.toFixed(2) : raw} ${ind.unit||''} (${norm.toFixed(0)}%)`;
      else valueEl.textContent = `— (${prevNorm[i].toFixed(0)}%)`;
      tooltip.textContent = `Delta: ${prevDelta[i].toFixed(1)}%`;
      const {bg, alert} = getColor(prevNorm[i]);
      cell.style.background = bg;
      if (alert) cell.classList.add("alert"); else cell.classList.remove("alert");
      if (norm !== null) trendHistory[i].push(norm);
      if (trendHistory[i].length > 120) trendHistory[i].shift();
      drawTrend(i);
    } else if (prevNorm[i] !== null) {
      totalNorm += prevNorm[i];
      validCount++;
    }
  });

  const avgNorm = validCount > 0 ? totalNorm / validCount : 50;
  pulseHistory.push(avgNorm);
  if (pulseHistory.length > 300) pulseHistory.shift();
  drawPulse();

  let status = "Норма";
  let statusColor = "#ffaa00";
  if (avgNorm < 30) { status = "Погано"; statusColor = "#ff0000"; }
  else if (avgNorm > 70) { status = "Добре"; statusColor = "#00ff00"; }
  center.textContent = `Стан системи: ${status} (${avgNorm.toFixed(1)}%)`;
  center.style.borderColor = statusColor;
}

function drawTrend(i) {
  const canvas = document.getElementById(`trend${i}`);
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (trendHistory[i].length < 2) return;
  ctx.strokeStyle = "#00ffdd";
  ctx.lineWidth = 2;
  ctx.beginPath();
  trendHistory[i].forEach((norm, j) => {
    const x = j * (canvas.width / (trendHistory[i].length - 1));
    const y = canvas.height * (1 - norm / 100);
    if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function drawPulse() {
  pulseCtx.clearRect(0, 0, pulseCanvas.width, pulseCanvas.height);
  if (pulseHistory.length < 2) return;
  pulseCtx.strokeStyle = "#ff00ff";
  pulseCtx.lineWidth = 3;
  pulseCtx.beginPath();
  pulseHistory.forEach((v, i) => {
    const x = i * (pulseCanvas.width / (pulseHistory.length - 1));
    const y = pulseCanvas.height * (1 - v / 100);
    if (i === 0) pulseCtx.moveTo(x, y); else pulseCtx.lineTo(x, y);
  });
  pulseCtx.stroke();
}

update("realtime");
update("hourly");
setInterval(() => update("realtime"), 60000);
setInterval(() => update("hourly"), 3600000);
</script>
</body>
</html>
