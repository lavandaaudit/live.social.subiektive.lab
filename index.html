<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibonarium Heatmap – Real-Time State</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }

body {
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  padding:20px 0;
}

h1 {
  margin-bottom:20px;
  font-size:2rem;
  color:#cfefff;
  text-align:center;
}

.heatmap {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  width:95%;
  max-width:1100px;
}

.cell {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-radius:10px;
  background:#111;
  font-weight:bold;
  font-size:0.95rem;
  padding:6px;
  transition:0.3s;
}

.cell.alert {
  animation:pulse 1s infinite;
}

@keyframes pulse {
  0%{box-shadow:0 0 5px #ff0000;}
  50%{box-shadow:0 0 20px #ff0000;}
  100%{box-shadow:0 0 5px #ff0000;}
}

.center-index {
  grid-column:1/-1;
  font-size:1.4rem;
  border:2px solid #00ffdd;
  border-radius:15px;
  padding:12px;
  text-align:center;
  margin-top:10px;
  animation:glow 2s infinite alternate;
}

@keyframes glow {
  from{box-shadow:0 0 5px #00ffdd;}
  to{box-shadow:0 0 20px #00ffdd;}
}

/* ===== Memory & Mood ===== */

.memory {
  width:95%;
  max-width:900px;
  margin-top:40px;
  padding:20px;
  border-top:1px solid #222;
}

.memory h2 {
  color:#cfefff;
  margin-bottom:15px;
  font-size:1.3rem;
}

.memory p {
  font-size:0.95rem;
  line-height:1.5;
  opacity:0.85;
  margin-bottom:10px;
}

.diary {
  margin-top:15px;
  padding-left:10px;
  border-left:2px solid #00ffdd;
  font-style:italic;
  color:#aeeeff;
}
</style>
</head>

<body>

<h1>Ibonarium Heatmap</h1>
<div class="heatmap" id="heatmap"></div>

<div class="memory">
  <h2>Субʼєктивний стан системи</h2>

  <p id="mood">Настрій системи: —</p>
  <p id="memory-short">Коротка памʼять: —</p>
  <p id="memory-mid">Середня памʼять: —</p>
  <p id="memory-long">Довга памʼять: —</p>

  <div class="diary" id="diary">Система спостерігає.</div>
</div>

<script>
// ===== Indicators (real APIs only) =====
const indicators = [
  {name:"BTC/USD", type:"crypto", api:"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"},
  {name:"ETH/USD", type:"crypto", api:"https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd"},
  {name:"DOGE/USD", type:"crypto", api:"https://api.coingecko.com/api/v3/simple/price?ids=dogecoin&vs_currencies=usd"},

  {name:"GitHub React", type:"tech", api:"https://api.github.com/repos/facebook/react/commits?per_page=5"},
  {name:"GitHub Python", type:"tech", api:"https://api.github.com/repos/python/cpython/commits?per_page=5"},

  {name:"Reddit Ukraine", type:"social", api:"https://www.reddit.com/r/ukraine/top.json?limit=5"},
  {name:"World News", type:"social", api:"https://www.reddit.com/r/worldnews/top.json?limit=5"},

  {name:"Weather Kyiv", type:"weather", api:"https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.523&current_weather=true"}
];

const heatmap = document.getElementById("heatmap");
let stateHistory = JSON.parse(localStorage.getItem("stateHistory") || "[]");

// ===== Create cells =====
indicators.forEach((ind,i)=>{
  const c = document.createElement("div");
  c.className="cell";
  c.id="cell"+i;
  c.innerHTML=`${ind.name}<div class="value">—</div>`;
  heatmap.appendChild(c);
});

const center = document.createElement("div");
center.className="center-index";
center.id="center";
center.textContent="Стан системи: —";
heatmap.appendChild(center);

// ===== Fetch =====
async function fetchVal(ind){
  try{
    const r = await fetch(ind.api);
    const d = await r.json();
    if(ind.type==="crypto") return Object.values(d)[0].usd;
    if(ind.type==="tech") return d.length;
    if(ind.type==="social") return d.data.children.length;
    if(ind.type==="weather") return d.current_weather.temperature;
  }catch{return 0;}
}

// ===== Update =====
async function update(){
  let total=0;

  for(let i=0;i<indicators.length;i++){
    const v = await fetchVal(indicators[i]);
    document.querySelector("#cell"+i+" .value").textContent = v.toFixed ? v.toFixed(1) : v;
    total += v>0 ? 1 : 0;
  }

  const avg = total / indicators.length;
  let state = "Норма";
  if(avg < 0.4) state="Тиша";
  if(avg > 0.7) state="Напруга";

  center.textContent="Стан системи: "+state;

  // ===== Memory =====
  stateHistory.push(avg);
  if(stateHistory.length>360) stateHistory.shift();
  localStorage.setItem("stateHistory",JSON.stringify(stateHistory));

  document.getElementById("mood").textContent =
    "Настрій системи: " + (avg>0.7?"Збуджений":avg<0.4?"Спокійний":"Перехідний");

  document.getElementById("memory-short").textContent =
    "Коротка памʼять: " + (avg>0.6?"Наростає":"Стабілізується");

  const mid = stateHistory.slice(-60).reduce((a,b)=>a+b,0)/Math.max(1,stateHistory.length);
  document.getElementById("memory-mid").textContent =
    "Середня памʼять: " + (mid>0.6?"Тривалий тиск":"Рівний фон");

  const long = stateHistory.reduce((a,b)=>a+b,0)/stateHistory.length;
  document.getElementById("memory-long").textContent =
    "Довга памʼять: " + (long>0.6?"Нестійка рівновага":"Тиха стабільність");

  document.getElementById("diary").textContent =
    long>0.6 ? "Система довго утримує напругу." :
    "Система памʼятає спокій.";
}

update();
setInterval(update,60000);
</script>

</body>
</html>
